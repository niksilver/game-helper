[project]
name = "gamehelper"
version = "0.1.0"
description = "Helping create cards and tokens for board games."
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Nik Silver", email = "nik@niksilver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.1",
    "fpdf2>=2.8.8",
    "html2image>=2.0.7",
    "openpyxl>=3.1.5",
    "pdoc>=16.0.0",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/niksilver/game-helper"
Issues = "https://github.com/niksilver/game-helper/issues"
